services:

  # ── 1. Postgres ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"       # expose for local psql / DBeaver access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── 2. FastAPI app ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload in dev: mount source over the image copy
      - .:/app
    command: >
      sh entrypoint.sh
    depends_on:
      db:
        condition: service_healthy

  # ── 3. Scraper (one-shot job) ──────────────────────────────────────────────
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SCRAPER_LIVE:  ${SCRAPER_LIVE:-0}
    volumes:
      # Mount HTML sample files so offline mode works without rebuilding
      - .:/app
    command: python run_scraper.py
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    # Don't restart automatically — run once on demand:
    #   docker compose run --rm scraper
    profiles:
      - scraper

volumes:
  postgres_data:
