services:

  # ── 1. Postgres ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:             ${POSTGRES_USER}
      POSTGRES_PASSWORD:         ${POSTGRES_PASSWORD}
      POSTGRES_DB:               ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"       # expose for local psql / DBeaver access (5433 avoids conflict with local PG)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── 2. FastAPI app ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload in dev: mount source over the image copy
      - .:/app
    command: >
      sh entrypoint.sh
    depends_on:
      db:
        condition: service_healthy

  # ── 3. Scraper (runs every hour) ──────────────────────────────────────────
  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL:      ${DATABASE_URL}
      SCRAPER_LIVE:      ${SCRAPER_LIVE:-0}
      SCRAPER_INTERVAL:  ${SCRAPER_INTERVAL:-3600}
    depends_on:
      db:
        condition: service_healthy

  # ── 4. React frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
